const pmap=Object.fromEntries(DB.perspectives.map(x=>[x.ID_Perspectiva,x]));const omap=Object.fromEntries(DB.objectives.map(x=>[x.ID_Objetivo,x]));const imap=Object.fromEntries(DB.indicators.map(x=>[x.ID_Indicador,x]));const procmap=Object.fromEntries(DB.processes.map(x=>[x.ID_Processo,x]));
function pct(x){return new Intl.NumberFormat('pt-BR',{style:'percent',maximumFractionDigits:1}).format(x||0)}function num(x){return new Intl.NumberFormat('pt-BR',{maximumFractionDigits:1}).format(x||0)}function dt(x){if(!x)return 'Sem dados';return new Date(x+'T00:00:00').toLocaleDateString('pt-BR')}
function status(r){let i=imap[r.ID_Indicador],m=+r.Meta,v=+r.Realizado;if(!m||!v)return['Sem dados',0,'#A6A6A6'];let a=i.Polaridade==='Positiva'?v/m:m/v;return[a>=1?'Verde':a>=.9?'Amarelo':'Vermelho',a,a>=1?'#70AD47':a>=.9?'#FFC000':'#C00000']}
const periods=[...new Set(DB.performance.map(x=>x.Data_Referencia))].sort();let selected=periods.at(-1),pers='';
function current(){return DB.performance.filter(x=>x.Data_Referencia===selected&&(!pers||omap[imap[x.ID_Indicador].ID_Objetivo].ID_Perspectiva===pers))}
function pill(s,c){return `<span class="pill" style="background:${c}">${s}</span>`}
function card(l,v,c='#17365D'){return `<div class="card"><div class="label">${l}</div><div class="value" style="color:${c}">${v}</div></div>`}
function panel(t,b){return `<div class="panel"><h3>${t}</h3>${b}</div>`}
function bars(items){return `<div class="bars">${items.map(x=>`<div class="row"><span>${x[0]}</span><div class="track"><div class="fill" style="width:${Math.min(x[1]*100,120)/1.2}%;background:${x[2]}"></div></div><b>${pct(x[1])}</b></div>`).join('')}</div>`}
function donut(counts){let total=Object.values(counts).reduce((a,b)=>a+b,0)||1,a=counts.Verde/total*360,b=(counts.Verde+counts.Amarelo)/total*360;return `<div class="donut" style="background:conic-gradient(#70AD47 0 ${a}deg,#FFC000 ${a}deg ${b}deg,#C00000 ${b}deg 360deg)"></div><div class="legend"><span><i class="dot" style="background:#70AD47"></i>Verde: ${counts.Verde||0}</span><span><i class="dot" style="background:#FFC000"></i>Amarelo: ${counts.Amarelo||0}</span><span><i class="dot" style="background:#C00000"></i>Vermelho: ${counts.Vermelho||0}</span></div>`}
function lineChart(vals){if(!vals.length)return'<div class="empty">Sem dados</div>';let w=600,h=170,p=20,min=Math.min(...vals.map(x=>x[1]),.8),max=Math.max(...vals.map(x=>x[1]),1.1),pts=vals.map((x,i)=>[(p+i*(w-2*p)/Math.max(vals.length-1,1)),h-p-(x[1]-min)/(max-min)*(h-2*p)]);return `<div class="line"><svg viewBox="0 0 ${w} ${h}"><line x1="20" y1="${h-p-(1-min)/(max-min)*(h-2*p)}" x2="580" y2="${h-p-(1-min)/(max-min)*(h-2*p)}" stroke="#FFC000" stroke-dasharray="5"/><polyline fill="none" stroke="#2F75B5" stroke-width="3" points="${pts.map(x=>x.join(',')).join(' ')}"/>${pts.map((x,i)=>`<circle cx="${x[0]}" cy="${x[1]}" r="4" fill="#17365D"><title>${vals[i][0]}: ${pct(vals[i][1])}</title></circle>`).join('')}</svg></div>`}
function table(headers,rows){return `<div class="tablewrap"><table><thead><tr>${headers.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(x=>`<td>${x??''}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}
function renderExecutive(){let cur=current(), sts=cur.map(r=>status(r)), counts={Verde:0,Amarelo:0,Vermelho:0};sts.forEach(s=>counts[s[0]]++);let avg=sts.reduce((a,s)=>a+Math.min(s[1],1.2),0)/(sts.length||1),aa=DB.actions.filter(x=>x.Status_Acao==='Atrasada').length,approved=DB.processes.filter(x=>x.Status_Modelagem==='Aprovado').length/DB.processes.length;let byp=DB.perspectives.filter(x=>!pers||x.ID_Perspectiva===pers).map(p=>{let rs=cur.filter(r=>omap[imap[r.ID_Indicador].ID_Objetivo].ID_Perspectiva===p.ID_Perspectiva),a=rs.reduce((z,r)=>z+Math.min(status(r)[1],1.2),0)/(rs.length||1);return[p.Perspectiva,a,a>=1?'#70AD47':a>=.9?'#FFC000':'#C00000']});let evo=periods.map(d=>{let rs=DB.performance.filter(r=>r.Data_Referencia===d&&(!pers||omap[imap[r.ID_Indicador].ID_Objetivo].ID_Perspectiva===pers));return[d.slice(0,7),rs.reduce((z,r)=>z+Math.min(status(r)[1],1.2),0)/(rs.length||1)]});let priority=cur.map(r=>[r,status(r)]).filter(x=>x[1][0]!=='Verde').sort((a,b)=>a[1][1]-b[1][1]).map(([r,s])=>{let i=imap[r.ID_Indicador],o=omap[i.ID_Objetivo];return[pmap[o.ID_Perspectiva].Perspectiva,o.Objetivo_Estrategico,i.Indicador,o.Area_Responsavel,num(r.Meta),num(r.Realizado),pct(s[1]),pill(s[0],s[2])]} );document.querySelector('#executive').innerHTML=`<div class="cards">${card('Índice Geral de Desempenho',pct(avg),'#2F75B5')}${card('Indicadores na Meta',counts.Verde,'#70AD47')}${card('Indicadores em Atenção',counts.Amarelo,'#FFC000')}${card('Indicadores Críticos',counts.Vermelho,'#C00000')}${card('Ações Atrasadas',aa,'#C00000')}${card('Processos Aprovados',pct(approved),'#00A6A6')}</div><div class="grid3">${panel('Desempenho por Perspectiva',bars(byp))}${panel('Distribuição do Farol',donut(counts))}${panel('Evolução Institucional',lineChart(evo))}</div>${panel('Indicadores Prioritários',priority.length?table(['Perspectiva','Objetivo','Indicador','Área','Meta','Realizado','Atingimento','Farol'],priority):'<div class="empty">Não há indicadores em atenção ou críticos no período.</div>')}`}
function renderStrategy(){let cur=current();let bands=[...DB.perspectives].sort((a,b)=>b.Ordem-a.Ordem).filter(x=>!pers||x.ID_Perspectiva===pers).map(p=>{let os=DB.objectives.filter(o=>o.ID_Perspectiva===p.ID_Perspectiva);return `<div class="band"><h3>${p.Perspectiva}</h3><div class="objgrid">${os.map(o=>{let rs=cur.filter(r=>imap[r.ID_Indicador].ID_Objetivo===o.ID_Objetivo),a=rs.reduce((z,r)=>z+status(r)[1],0)/(rs.length||1),c=a>=1?'#70AD47':a>=.9?'#FFC000':'#C00000',pc=DB.processes.filter(x=>x.ID_Objetivo===o.ID_Objetivo).length;return `<div class="obj" style="border-color:${c}"><b>${o.ID_Objetivo} · ${o.Objetivo_Estrategico}</b>${o.Area_Responsavel}<br><br>${pill(a>=1?'Verde':a>=.9?'Amarelo':'Vermelho',c)} &nbsp; ${pct(a)}<br><small>${rs.length} indicadores · ${pc} processos</small></div>`}).join('')}</div></div>`}).join('');document.querySelector('#strategy').innerHTML=`<div class="bsc">${bands}</div>`}
function renderIndicators(){let cur=current(),rows=cur.map(r=>{let i=imap[r.ID_Indicador],o=omap[i.ID_Objetivo],s=status(r);return[i.ID_Indicador,i.Indicador,pmap[o.ID_Perspectiva].Perspectiva,o.Objetivo_Estrategico,i.Polaridade,i.Unidade,num(r.Meta),num(r.Realizado),pct(s[1]),pill(s[0],s[2]),dt(r.Data_Atualizacao),r.Status_Validacao]}).sort((a,b)=>parseFloat(a[8])-parseFloat(b[8]));document.querySelector('#indicators').innerHTML=`${panel('Cadastro e desempenho dos indicadores',table(['Código','Indicador','Perspectiva','Objetivo','Polaridade','Unidade','Meta','Realizado','Atingimento','Farol','Atualização','Validação'],rows))}`}
function renderProcesses(){let counts={Aprovado:0,'Em revisão':0,'Em modelagem':0};DB.processes.forEach(x=>counts[x.Status_Modelagem]=(counts[x.Status_Modelagem]||0)+1);let high=DB.processes.filter(x=>x.Criticidade==='Alta').length;let groups=['Gerencial','Finalístico','Suporte'].map(type=>`<div>${panel('Processos '+type.toLowerCase()+ 's',`<div class="processgrid">${DB.processes.filter(x=>x.Tipo_Processo===type).map(x=>`<div class="pcard"><b>${x.Processo}</b><br><br>${pill(x.Criticidade,x.Criticidade==='Alta'?'#C00000':x.Criticidade==='Média'?'#FFC000':'#70AD47')} ${x.Status_Modelagem}<br><small>${x.Area_Responsavel}<br>Revisão: ${dt(x.Data_Ultima_Revisao)}</small></div>`).join('')}</div>`)}</div>`).join('');document.querySelector('#processes').innerHTML=`<div class="cards">${card('Processos cadastrados',DB.processes.length)}${card('Aprovados',counts.Aprovado,'#70AD47')}${card('Em revisão',counts['Em revisão'],'#FFC000')}${card('Em modelagem',counts['Em modelagem'],'#2F75B5')}${card('Alta criticidade',high,'#C00000')}${card('Cobertura aprovada',pct(counts.Aprovado/DB.processes.length),'#00A6A6')}</div>${groups}`}
function renderActions(){let c={};DB.actions.forEach(x=>c[x.Status_Acao]=(c[x.Status_Acao]||0)+1);let avg=DB.actions.reduce((a,x)=>a+(+x.Percentual_Execucao||0),0)/DB.actions.length;let rs=DB.actions.map(x=>[x.ID_Acao,x.Acao,imap[x.ID_Indicador]?.Indicador||x.ID_Indicador,procmap[x.ID_Processo]?.Processo||x.ID_Processo,x.Responsavel,dt(x.Data_Inicio),dt(x.Prazo),`<div class="progress"><div style="width:${x.Percentual_Execucao}%"></div></div> ${x.Percentual_Execucao}%`,pill(x.Status_Acao,x.Status_Acao==='Concluída'?'#70AD47':x.Status_Acao==='Atrasada'?'#C00000':x.Status_Acao==='Em andamento'?'#2F75B5':'#A6A6A6'),x.Evidencia]);document.querySelector('#actions').innerHTML=`<div class="cards">${card('Total de ações',DB.actions.length)}${card('Concluídas',c['Concluída']||0,'#70AD47')}${card('Em andamento',c['Em andamento']||0,'#2F75B5')}${card('Atrasadas',c['Atrasada']||0,'#C00000')}${card('Não iniciadas',c['Não iniciada']||0,'#A6A6A6')}${card('Execução média',pct(avg/100),'#00A6A6')}</div>${panel('Detalhamento dos Planos de Ação',table(['ID','Ação','Indicador','Processo','Responsável','Início','Prazo','Execução','Status','Evidência'],rs))}`}
function renderGovernance(){let cur=current(),pending=cur.filter(x=>x.Status_Validacao!=='Validado').length,noev=DB.actions.filter(x=>x.Evidencia==='Pendente').length,areas=new Set(DB.indicators.map(x=>x.Area_Responsavel)).size,rs=cur.map(r=>{let i=imap[r.ID_Indicador],o=omap[i.ID_Objetivo];return[o.Area_Responsavel,i.Indicador,dt(r.Data_Referencia),dt(r.Data_Atualizacao),r.Status_Validacao,r.Status_Validacao==='Validado'?pill('Regular','#70AD47'):pill('Validação pendente','#FFC000')]} );document.querySelector('#governance').innerHTML=`<div class="cards">${card('Indicadores atualizados',cur.length,'#70AD47')}${card('Pendentes de validação',pending,'#FFC000')}${card('Sem atualização',0,'#A6A6A6')}${card('Ações sem evidência',noev,'#C00000')}${card('Áreas monitoradas',areas,'#2F75B5')}${card('Última atualização','25/08/2026','#00A6A6')}</div>${panel('Rastreabilidade e pendências',table(['Área','Indicador','Referência','Atualização','Validação','Situação'],rs))}`}
function render(){renderExecutive();renderStrategy();renderIndicators();renderProcesses();renderActions();renderGovernance();document.querySelector('#updated').textContent='Dados atualizados até: 25/08/2026'}
function show(id){pages.forEach(p=>document.querySelector('#'+p[0]).classList.toggle('active',p[0]===id));document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.id===id));let p=pages.find(x=>x[0]===id);document.querySelector('#title').textContent=p[1];document.querySelector('#subtitle').textContent=p[2]}
